<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portafolio Interactivo</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <main class="container py-5">

    <h1 class="mb-4">
      Mis proyectos interactivos
    </h1>

    <p class="mb-4">
      En esta página puedo agregar y eliminar proyectos utilizando JavaScript y el DOM.
    </p>

    <!-- BOTÓN AGREGAR -->
    <button
      id="agregar"
      class="btn btn-primary mb-4"
    >
      Agregar proyecto
    </button>

    <!-- CONTENEDOR DE PROYECTOS -->
    <div
      id="proyectos"
      class="row g-4"
    >

      <!-- Proyecto inicial -->
      <div class="col-12 col-md-4">

        <div class="card h-100">

          <div class="card-body">

            <h2 class="card-title h5">
              Apex Iron
            </h2>

            <p class="card-text">
              E-commerce especializado en hardware desarrollado como proyecto integrador.
            </p>

          </div>

        </div>

      </div>

    </div>

  </main>

  <!-- JavaScript -->
  <script src="./Interactivo.js"></script>

</body>
</html>
